<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g transform="translate(50, 50)">
    <!-- Outer reel frame -->
    <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#9ca3af" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="42" fill="#0f172a"/>
    
    <!-- Dark Blue Magnetic Tape Wound -->
    <circle cx="0" cy="0" r="38" fill="#1e3a8a"/>
    <circle cx="0" cy="0" r="36" fill="#1d4ed8"/>
    
    <!-- Rotating hub & spokes -->
    <g id="reel-rotation">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="4s"
        repeatCount="indefinite"/>
        
      <!-- Clear/Transparent hub inner area -->
      <circle cx="0" cy="0" r="16" fill="#94a3b8" opacity="0.3"/>
      
      <!-- 3 classic IBM reel spokes / cutouts -->
      <polygon points="0,0 -4,-18 4,-18" fill="#d1d5db"/>
      <polygon points="0,0 15,8 12,14" fill="#d1d5db"/>
      <polygon points="0,0 -15,8 -12,14" fill="#d1d5db"/>
      
      <!-- Metallic center clamp -->
      <circle cx="0" cy="0" r="6" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
      <circle cx="0" cy="0" r="2.5" fill="#1f2937"/>
    </g>
  </g>
</svg>