<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 500" width="140" height="500">
  <style>
    @keyframes led-blink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 3px currentColor); }
      50% { opacity: 0.3; filter: none; }
    }
    .blink-fast { animation: led-blink 0.5s infinite; }
    .blink-med { animation: led-blink 1.2s infinite; }
    .blink-slow { animation: led-blink 2.2s infinite; }
  </style>

  <!-- Main Cabinet Background -->
  <rect width="140" height="500" fill="#0f172a" rx="6" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="5" y="5" width="130" height="490" fill="#1e293b" rx="4"/>
  
  <!-- Upper Console (Angled beige-gray housing style) -->
  <rect x="12" y="15" width="116" height="150" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <rect x="15" y="18" width="110" height="144" fill="#0f172a"/>
  
  <!-- Control Panel on Upper Left -->
  <rect x="22" y="30" width="55" height="115" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Square Green Button ("0") -->
  <rect x="30" y="42" width="16" height="16" rx="2" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
  <text x="38" y="54" font-family="monospace" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">0</text>
  
  <!-- Square Red Button ("SELECT / LOCK") -->
  <rect x="52" y="42" width="16" height="16" rx="2" fill="#ef4444" stroke="#b91c1c" stroke-width="1" class="blink-fast"/>
  <text x="60" y="53" font-family="monospace" font-size="6" fill="#ffffff" text-anchor="middle" font-weight="bold">LOK</text>
  
  <!-- Mechanical Three-Digit Counter showing "369" -->
  <rect x="30" y="72" width="38" height="16" rx="1" fill="#0b0f19" stroke="#64748b" stroke-width="1"/>
  <text x="49" y="84" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="bold">369</text>
  
  <!-- Toggle Switches & Indicator Lights (ENABLE / DISABLE) -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="8" height="12" fill="#cbd5e1" stroke="#334155" stroke-width="0.5"/>
    <circle cx="20" cy="6" r="3" fill="#22c55e" class="blink-slow"/>
    <text x="28" y="8" font-family="monospace" font-size="5" fill="#94a3b8">ENAB</text>
    
    <rect x="0" y="18" width="8" height="12" fill="#cbd5e1" stroke="#334155" stroke-width="0.5"/>
    <circle cx="20" cy="24" r="3" fill="#ef4444" class="blink-med"/>
    <text x="28" y="26" font-family="monospace" font-size="5" fill="#94a3b8">DIS</text>
  </g>

  <!-- Disk Compartment Window (Right side of upper console) -->
  <rect x="85" y="30" width="35" height="115" rx="2" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- CORRECTED: Completely static platters (no rotation/spinning effect at all) -->
  <g>
    <!-- Central spindle rod -->
    <rect x="99" y="42" width="6" height="86" fill="#cbd5e1" rx="1"/>
    
    <!-- Stack of horizontal magnetic platters (completely fixed/static side profile view) -->
    <rect x="88" y="46" width="28" height="4" fill="#94a3b8" rx="1"/>
    <rect x="88" y="58" width="28" height="4" fill="#94a3b8" rx="1"/>
    <rect x="88" y="70" width="28" height="4" fill="#94a3b8" rx="1"/>
    <rect x="88" y="82" width="28" height="4" fill="#94a3b8" rx="1"/>
    <rect x="88" y="94" width="28" height="4" fill="#94a3b8" rx="1"/>
    <rect x="88" y="106" width="28" height="4" fill="#94a3b8" rx="1"/>
    <rect x="88" y="118" width="28" height="4" fill="#94a3b8" rx="1"/>
    <rect x="88" y="130" width="28" height="4" fill="#94a3b8" rx="1"/>
  </g>

  <!-- Lower Cabinet: Vibrant IBM Blue Panel -->
  <rect x="12" y="175" width="116" height="310" rx="2" fill="#1f2937"/>
  <rect x="15" y="178" width="110" height="304" fill="#2563eb"/> <!-- Classic IBM Blue -->
  
  <!-- Horizontal brushed-metal handle bar across top of blue panel -->
  <rect x="15" y="178" width="110" height="6" fill="#94a3b8"/>
  <rect x="15" y="178" width="110" height="2" fill="#ffffff" opacity="0.8"/>
  
  <!-- IBM 2311 Black & Gold Badge in upper-right corner -->
  <rect x="80" y="190" width="40" height="14" rx="1" fill="#000000" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="200" font-family="monospace" font-size="7" fill="#f59e0b" text-anchor="middle" font-weight="bold">IBM 2311</text>
  
  <!-- Additional status indicator lights inside the IBM blue door -->
  <g transform="translate(30, 225)">
    <circle cx="0" cy="0" r="4" fill="#22c55e" class="blink-slow"/>
    <text x="12" y="4" font-family="monospace" font-size="7" fill="#ffffff">READY</text>
    
    <circle cx="0" cy="22" r="4" fill="#f59e0b" class="blink-med"/>
    <text x="12" y="26" font-family="monospace" font-size="7" fill="#ffffff">ACCESS</text>
    
    <circle cx="0" cy="44" r="4" fill="#ef4444" class="blink-fast"/>
    <text x="12" y="48" font-family="monospace" font-size="7" fill="#ffffff">FAULT</text>
  </g>

  <!-- Decorative rack ventilation slots -->
  <g transform="translate(30, 310)" fill="#111827">
    <rect x="0" y="0" width="80" height="4" rx="1"/>
    <rect x="0" y="10" width="80" height="4" rx="1"/>
    <rect x="0" y="20" width="80" height="4" rx="1"/>
    <rect x="0" y="30" width="80" height="4" rx="1"/>
    <rect x="0" y="40" width="80" height="4" rx="1"/>
    <rect x="0" y="50" width="80" height="4" rx="1"/>
    <rect x="0" y="60" width="80" height="4" rx="1"/>
    <rect x="0" y="70" width="80" height="4" rx="1"/>
  </g>

  <!-- Glass reflection lines -->
  <line x1="20" y1="200" x2="100" y2="450" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>
</svg>