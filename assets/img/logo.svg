<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Laptop base -->
  <rect x="40" y="130" width="120" height="8" rx="2" fill="#334155"/>
  
  <!-- Laptop screen frame -->
  <rect x="50" y="60" width="100" height="70" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Code lines on screen -->
  <g opacity="0.9">
    <!-- Line 1: import -->
    <text x="58" y="78" font-family="monospace" font-size="8" fill="#38bdf8">import sys</text>
    
    <!-- Line 2: function -->
    <text x="58" y="88" font-family="monospace" font-size="8" fill="#22c55e">def config():</text>
    
    <!-- Line 3: network -->
    <text x="65" y="98" font-family="monospace" font-size="8" fill="#f59e0b">net = TCP()</text>
    
    <!-- Line 4: server -->
    <text x="65" y="108" font-family="monospace" font-size="8" fill="#8b5cf6">srv.start()</text>
    
    <!-- Line 5: return -->
    <text x="65" y="118" font-family="monospace" font-size="8" fill="#38bdf8">return True</text>
  </g>
  
  <!-- Terminal cursor -->
  <rect x="105" y="112" width="6" height="8" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Connection indicator (small network icon) -->
  <g transform="translate(145, 70)">
    <circle cx="0" cy="0" r="3" fill="#22c55e"/>
    <circle cx="8" cy="0" r="3" fill="#22c55e"/>
    <line x1="3" y1="0" x2="5" y2="0" stroke="#22c55e" stroke-width="1.5"/>
  </g>
</svg>